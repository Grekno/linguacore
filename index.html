<style>
/* Layout: navegación inferior en móvil y lateral en escritorio; una columna de contenido de 640px.

:root{--bg:#070C18;--surf:#0F1830;--surf2:#162240;--line:rgba(150,180,235,.16);--ink:#EAF0FB;--mut:#9AABC7;--accA:#6C97FF;--accB:#35D6C2;--accC:#FF9B62;--priA:#6C97FF;--priB:#35D6C2;--pri-fg:#06101F;--priglow:rgba(53,214,194,.22);--ok:#4ADE9A;--bad:#FF8279;--okbg:rgba(74,222,154,.10);--badbg:rgba(255,130,121,.10);--en:#6C97FF;--en2:#4A6FE0;--ja:#FF8A67;--ja2:#E8553A;--el:#35D6C2;--el2:#1BA899;--zh:#F5B84A;--zh2:#E08A1E;--it:#5BD68A;--it2:#2FAE63;--de:#A98BFF;--de2:#7B5CE6;--on:#06101F;--glow1:rgba(108,151,255,.18);--glow2:rgba(53,214,194,.10);--navbg:rgba(7,12,24,.82);--shadow:0 10px 30px rgba(0,0,0,.28);--tileglow:rgba(0,0,0,.35);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F3F6FB;--surf:#FFFFFF;--surf2:#EEF2F9;--line:rgba(15,27,51,.12);--ink:#0F1B33;--mut:#53668A;--accA:#2F5FD0;--accB:#0B857B;--accC:#D9602A;--priA:#2A55C4;--priB:#0B7F76;--pri-fg:#FFFFFF;--priglow:rgba(42,85,196,.22);--ok:#1B7F57;--bad:#B3261E;--okbg:rgba(27,127,87,.08);--badbg:rgba(179,38,30,.07);--en:#2F5FD0;--en2:#1F46A8;--ja:#D9482B;--ja2:#B63220;--el:#0B857B;--el2:#096B63;--zh:#A8660A;--zh2:#7D4A05;--it:#1F8A4C;--it2:#146C3A;--de:#6A4CD6;--de2:#4F37B0;--on:#FFFFFF;--glow1:rgba(47,95,208,.10);--glow2:rgba(11,133,123,.07);--navbg:rgba(255,255,255,.86);--shadow:0 8px 24px rgba(15,27,51,.08);--tileglow:rgba(15,27,51,.22);color-scheme:light}}
:root[data-theme="light"]{--bg:#F3F6FB;--surf:#FFFFFF;--surf2:#EEF2F9;--line:rgba(15,27,51,.12);--ink:#0F1B33;--mut:#53668A;--accA:#2F5FD0;--accB:#0B857B;--accC:#D9602A;--priA:#2A55C4;--priB:#0B7F76;--pri-fg:#FFFFFF;--priglow:rgba(42,85,196,.22);--ok:#1B7F57;--bad:#B3261E;--okbg:rgba(27,127,87,.08);--badbg:rgba(179,38,30,.07);--en:#2F5FD0;--en2:#1F46A8;--ja:#D9482B;--ja2:#B63220;--el:#0B857B;--el2:#096B63;--zh:#A8660A;--zh2:#7D4A05;--it:#1F8A4C;--it2:#146C3A;--de:#6A4CD6;--de2:#4F37B0;--on:#FFFFFF;--glow1:rgba(47,95,208,.10);--glow2:rgba(11,133,123,.07);--navbg:rgba(255,255,255,.86);--shadow:0 8px 24px rgba(15,27,51,.08);--tileglow:rgba(15,27,51,.22);color-scheme:light}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(780px 420px at 85% -8%,var(--glow1),transparent 65%),radial-gradient(640px 380px at -5% 4%,var(--glow2),transparent 62%);background-repeat:no-repeat;color:var(--ink);font-family:'Hanken Grotesk',system-ui,'Hiragino Sans','Noto Sans JP',sans-serif;font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.wm,.big,.num,.tile .g,.stat3 b,.mode b,.lg{font-family:'Bricolage Grotesque','Hanken Grotesk',system-ui,'Hiragino Sans','Noto Sans JP',sans-serif}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:26px 0 10px;text-wrap:balance}
h3{font-size:16px;font-weight:700;margin:0 0 4px}
p{margin:0}
.mut{color:var(--mut);font-size:14px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.stack{display:grid;gap:10px}
/* shell */
.shell{max-width:1040px;margin:0 auto}
.main{max-width:640px;margin:0 auto;padding:14px 0 112px}
.sess{max-width:640px;margin:0 auto;padding:16px 0 40px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.wm{font-weight:800;font-size:21px;letter-spacing:-.02em;background:linear-gradient(90deg,var(--accA),var(--accB) 55%,var(--accC));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-d{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:600}
.pill svg{color:var(--accC)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:4px;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:var(--navbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}

.ni[aria-selected="true"]{color:var(--ink);background:var(--surf2)}
.ni[aria-selected="true"] svg{color:var(--accB)}

 .shell{display:grid;grid-template-columns:210px minmax(0,640px);gap:48px;justify-content:center;padding-top:32px}

 .brand-d{display:flex;margin-bottom:18px}.brand-m{display:none}

}
/* superficies */
.box{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.hero{background:var(--surf);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.himg{background:#0B1020;aspect-ratio:1376/768}

.hbody{display:flex;align-items:center;gap:14px;padding:16px 16px 4px}
.hbtns{display:grid;gap:10px;padding:12px 16px 16px}
.ring{flex:none}.ring .rt{fill:var(--ink);font:700 17px 'Bricolage Grotesque',system-ui,sans-serif}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat3{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat3 b{font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}.stat3 span{color:var(--mut);font-size:13px}
.f1 svg{color:var(--accC)}.f2 svg{color:var(--accB)}.f3 svg{color:var(--accA)}
.en{--c1:var(--en);--c2:var(--en2)}.ja{--c1:var(--ja);--c2:var(--ja2)}.el{--c1:var(--el);--c2:var(--el2)}.zh{--c1:var(--zh);--c2:var(--zh2)}.it{--c1:var(--it);--c2:var(--it2)}.de{--c1:var(--de);--c2:var(--de2)}
.lc{display:flex;gap:14px;align-items:center;padding:14px;background:var(--surf);border:1px solid var(--line);border-radius:18px;margin-bottom:10px}
.lg{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:21px;font-weight:700;color:var(--on);background:linear-gradient(145deg,var(--c1),var(--c2));flex:none}
.lb{flex:1;min-width:0}.lb .bar{margin:8px 0 6px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:12px 0 18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1,var(--accA)),var(--c2,var(--accB)));border-radius:9px;transition:width .35s ease}
.empty{text-align:center;padding:28px 8px;display:grid;justify-items:center;gap:10px}.empty p{max-width:34ch}.empty .pri{max-width:320px}
.done{text-align:center;padding:20px 0 8px;display:grid;justify-items:center;gap:8px}
.greet{display:flex;gap:12px;align-items:center}
.bubble{background:var(--surf);border:1px solid var(--line);border-radius:18px;border-bottom-left-radius:6px;padding:12px 16px;font-weight:600;font-size:17px}
.av{border-radius:50%;object-fit:cover;background:var(--surf2);border:1px solid var(--line);flex:none;display:block}
/* controles */
button{font:inherit;cursor:pointer;border-radius:14px;border:1px solid var(--line);background:var(--surf2);color:var(--ink);padding:11px 14px;font-weight:600;transition:transform .12s ease,border-color .15s}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{opacity:.5;cursor:default}
@media (hover:hover){button:hover:not(:disabled){border-color:var(--accB)}}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accB);outline-offset:2px}
.pri{background:linear-gradient(135deg,var(--priA),var(--priB));color:var(--pri-fg);border:0;width:100%;padding:15px;font-size:17px;font-weight:700;box-shadow:0 8px 22px var(--priglow)}
.ghost{background:transparent}
.mini{padding:6px 11px;font-size:13px;border-radius:10px;display:inline-flex;align-items:center;gap:6px}
.icb{width:42px;height:42px;padding:0;display:inline-grid;place-items:center;border-radius:13px;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{padding:8px 14px;border-radius:99px;font-size:14px;background:var(--surf)}
.chip.on{background:linear-gradient(135deg,var(--priA),var(--priB));color:var(--pri-fg);border-color:transparent}
.lab{display:block;font-size:14px;font-weight:600;margin:12px 0 6px;color:var(--mut)}
input[type=text],textarea{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surf2);color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--mut)}
textarea{min-height:110px;resize:vertical}
.tools{display:flex;gap:8px;margin-top:10px}.tools button{flex:1}
.opts{display:grid;gap:8px}.opts button{text-align:left;font-size:17px;padding:14px 16px;background:var(--surf)}
/* sesión de repaso */
.tile{position:relative;border-radius:24px;padding:42px 18px 30px;text-align:center;color:var(--on);margin-bottom:16px;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 14px 36px var(--tileglow);overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(260px 160px at 88% 0%,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
.tile .tl{position:absolute;top:14px;left:16px;font-size:12px;font-weight:700;background:rgba(0,0,0,.16);border-radius:99px;padding:3px 11px}
.tile .g{font-size:56px;font-weight:800;line-height:1.1;overflow-wrap:anywhere}.tile .g.s{font-size:28px}
.tile .q{font-size:17px;margin-top:10px;position:relative}
.fb{margin-top:14px;padding:14px;border-radius:16px;background:var(--okbg);border:1px solid var(--ok);display:flex;gap:12px;align-items:flex-start}
.fb.x{background:var(--badbg);border-color:var(--bad)}
.fb svg{color:var(--ok)}.fb.x svg{color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
/* tutor */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:14px;border-radius:18px;background:var(--surf);height:100%}
.mi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surf2);color:var(--accB);flex:none}
.mode b{font-size:16px;line-height:1.2;font-weight:700}.mode small{color:var(--mut);font-weight:400;font-size:13px;line-height:1.35}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:4px}.mh h2{margin:0}
.msg{display:flex;gap:8px;align-items:flex-end;margin:10px 0}.msg.me{justify-content:flex-end}
.b{padding:10px 14px;border-radius:18px;max-width:86%;overflow-wrap:anywhere;white-space:pre-wrap}
.b.me{background:linear-gradient(135deg,var(--priA),var(--priB));color:var(--pri-fg);border-bottom-right-radius:6px}
.b.bot{background:var(--surf2);border:1px solid var(--line);border-bottom-left-radius:6px}
.bt{margin-top:6px}
.rd{color:var(--mut);font-size:14px;margin-top:2px}
.comp{display:flex;gap:8px;align-items:flex-end;margin-top:12px}.comp textarea{min-height:52px;max-height:160px;flex:1}
.send{width:52px;height:52px;padding:0;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,var(--priA),var(--priB));color:var(--pri-fg);border:0;flex:none}
.note{font-size:14px;margin:4px 0 10px 40px;border-left:3px solid var(--line);padding:2px 0 2px 10px;color:var(--mut)}
details.note summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.note div{margin-top:6px}
.hint{background:var(--surf2);border-radius:14px;padding:10px 12px;font-size:15px;margin:6px 0 6px 40px}
.err{border:1.5px solid var(--bad);background:var(--badbg);border-radius:14px;padding:10px 12px;margin:10px 0;font-size:15px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.cardi{border-top:1px solid var(--line);padding:12px 0}.cardi:first-child{border:0;padding-top:0}
.big{font-size:20px;font-weight:700;overflow-wrap:anywhere}
.tag{display:inline-block;background:var(--surf2);border-radius:8px;padding:2px 8px;font-size:13px;margin:2px 4px 2px 0}
.cols{display:flex;gap:6px;align-items:flex-end;height:80px;margin-top:8px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;color:var(--mut);min-width:0}.col i{display:block;width:100%;background:linear-gradient(180deg,var(--accB),var(--accA));border-radius:4px 4px 0 0;min-height:2px}
a{color:var(--accB)}
a.pri{display:block;text-align:center;text-decoration:none;border-radius:14px}
.badge{font-style:normal;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:10px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:99px;background:linear-gradient(135deg,var(--priA),var(--priB));color:var(--pri-fg);vertical-align:middle}
.foot{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);display:grid;justify-items:center;gap:12px;text-align:center}
.kofi{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surf2);color:var(--ink);font-weight:600;text-decoration:none}
.kofi svg{color:var(--accC)}
@media (hover:hover){.kofi:hover{border-color:var(--accC)}}
.foot .mut a{color:inherit}
</style>

<script>
// ================= Versión web: configuración y métricas =================
// En claude.ai (artefacto) la IA funciona con tu cuenta. Fuera de Claude (web instalable) el Tutor IA es PRO y aún no está disponible.
const CFG=window.LC_CONFIG||{};            // lo define config.js en la versión web
const STANDALONE=!(window.claude&&window.claude.use);
function track(name,data){try{if(window.umami&&window.umami.track){data?window.umami.track(name,data):window.umami.track(name)}}catch(e){}}
(function(){if(!STANDALONE||!CFG.umamiId)return;const s=document.createElement('script');s.defer=true;s.src=CFG.umamiSrc||'https://cloud.umami.is/script.js';s.setAttribute('data-website-id',CFG.umamiId);s.setAttribute('data-do-not-track','true');document.head.appendChild(s)})();
let DEFERRED=null;
if(STANDALONE){
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFERRED=e;if(typeof S!=='undefined'&&S&&S.tab==='rev'&&!SES)render()});
  window.addEventListener('appinstalled',()=>track('pwa_installed'));
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}

// ================= FSRS-4.5 (pesos por defecto) =================
const W=[0.4872,1.4003,3.7145,13.109,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
const DEC=-0.5,FAC=19/81,RET=0.9,DAY=864e5;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const Rt=(t,s)=>Math.pow(1+FAC*t/s,DEC);
function schedule(m,g,now){
  if(!m){m={d:clamp(W[4]-W[5]*(g-3),1,10),s:W[g-1],n:0,l:0}}
  else{
    const r=Rt((now-m.last)/DAY,m.s);
    const d=clamp(W[7]*W[4]+(1-W[7])*(m.d-W[6]*(g-3)),1,10);
    let s;
    if(g===1){s=Math.min(m.s,W[11]*Math.pow(d,-W[12])*(Math.pow(m.s+1,W[13])-1)*Math.exp((1-r)*W[14]));m.l++}
    else s=m.s*(1+Math.exp(W[8])*(11-d)*Math.pow(m.s,-W[9])*(Math.exp((1-r)*W[10])-1)*(g===2?W[15]:1)*(g===4?W[16]:1));
    m.d=d;m.s=Math.max(0.1,s);
  }
  m.n++;m.last=now;
  let iv=m.s/FAC*(Math.pow(RET,1/DEC)-1);
  if(m.n>19)iv*=1.15;
  m.due=g===1?now+10*60*1e3:now+Math.max(1,Math.round(iv*(0.95+Math.random()*0.1)))*DAY;
  return m;
}
const phase=n=>n<10?'ACQ':n<=19?'CONS':'MAINT';
const PW={ACQ:1,CONS:1.3,MAINT:0.6};

// ================= Contenido base =================
const I=(id,l,t,m,q,a,c,note,pre=[])=>({id,l,t,m,q,a,c,note,pre});
const ITEMS=[
I('e1','en','always','siempre','Escríbelo en inglés: «siempre»',['always'],['I ___ drink coffee in the morning.',['always']],'Adverbio de frecuencia: va antes del verbo principal.'),
I('e2','en','because','porque','Escríbelo en inglés: «porque»',['because'],['I stayed home ___ it was raining.',['because']],'Responde a «why?».'),
I('e3','en','need','necesitar','Escríbelo en inglés: «necesitar» (I ___)',['need','to need'],['I ___ more time to finish this.',['need']],'Verbo de alta frecuencia; «need to + verbo» expresa obligación.'),
I('e4','en','between','entre','Escríbelo en inglés: «entre» (dos cosas)',['between'],['The café is ___ the bank and the station.',['between']],'Entre dos elementos; «among» para más de dos.',['e1']),
I('e5','en','although','aunque','Escríbelo en inglés: «aunque»',['although'],['___ it was late, we kept talking.',['although']],'Más formal que «but»; no se combina con «but» en la misma frase.',['e2']),
I('j1','ja','人','persona','Kanji 人: ¿qué significa?',['persona','gente','hombre'],['あの＿は先生です。 Lectura de 人 (hiragana o romaji)',['ひと','hito']],'Radical: una figura que camina. On: ジン/ニン; Kun: ひと.'),

const KEY='linguacore-v2';
let S,SES=null,IDX={},CH=null,M={},KEEP={},HT=null,SAMPLE=null,SREADY=false;
const today=()=>new Date().toLocaleDateString('sv');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function defaults(){return{m:{},log:[],st:{cur:0,best:0,fr:1,last:null},f:'all',custom:[],err:{},journal:[],cfg:{lang:'en',level:'principiante',topics:{}}}}
function load(){
  let raw=null;try{raw=localStorage.getItem(KEY)||localStorage.getItem('linguacore-v1')}catch(e){}
  let o={};try{o=JSON.parse(raw)||{}}catch(e){}
  const d=defaults();S=Object.assign(d,o);S.st=Object.assign(defaults().st,o.st||{});S.cfg=Object.assign(defaults().cfg,o.cfg||{});S.cfg.topics=S.cfg.topics||{};
  S.tab='rev';S.mode=null;
  const st=S.st;
  if(st.last&&st.last!==today()){
    const gap=Math.round((Date.parse(today())-Date.parse(st.last))/DAY)-1;
    if(gap>0){if(st.fr>=gap){st.fr-=gap;st.last=new Date(Date.now()-DAY).toLocaleDateString('sv')}else st.cur=0}}
  reindex();save();
}
function save(){try{const{tab,mode,...rest}=S;localStorage.setItem(KEY,JSON.stringify(rest))}catch(e){}}
function reindex(){IDX={};ITEMS.forEach(i=>IDX[i.id]=i);S.custom.forEach(i=>IDX[i.id]=i)}
const ALL=()=>ITEMS.concat(S.custom);
const get=id=>IDX[id];
function ev(type,p){S.log.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),seq:S.log.length+1,type,ts:new Date().toISOString(),sv:'fsrs-4.5/default',...p});if(S.log.length>600)S.log=S.log.slice(-500)}
function touchStreak(){const st=S.st;if(st.last===today())return'';st.cur++;st.best=Math.max(st.best,st.cur);st.last=today();let m='';if(st.cur%7===0&&st.fr<3){st.fr++;m=' Has ganado un escudo de racha.'}ev('DAY_COMPLETE',{streak:st.cur});return m}

// memoria de errores recurrentes
function addErr(l,cat,pattern,ex){
  if(!pattern)return;pattern=String(pattern).slice(0,80);cat=String(cat||'otro').slice(0,24);
  const k=l+'|'+cat+'|'+pattern.toLowerCase();
  const e=S.err[k]||(S.err[k]={l,cat,pattern,n:0,last:null,ex:''});
  e.n++;e.last=today();if(ex)e.ex=String(ex).slice(0,160);
  const ks=Object.keys(S.err);if(ks.length>200){ks.sort((a,b)=>S.err[a].n-S.err[b].n).slice(0,40).forEach(x=>delete S.err[x])}
  save();
}
const errList=l=>Object.values(S.err).filter(x=>!l||x.l===l).sort((a,b)=>b.n-a.n);
const errCtx=l=>{const e=errList(l).slice(0,5);return e.length?e.map(x=>`${x.pattern} (${x.cat}, ${x.n} veces)`).join('; '):'ninguno registrado aún'};
const known=l=>ALL().filter(i=>i.l===l&&S.m[i.id]&&S.m[i.id].s>=3).map(i=>i.t);
const frontier=l=>{const k=known(l);return k.length?k.slice(0,150).join(', '):'ninguna registrada todavía'};

// tarjetas creadas desde la IA: entran en el repaso FSRS
function saveCard({l,t,m,note,alt}){
  t=String(t||'').trim();m=String(m||'').trim();if(!t||!m)return false;
  if(ALL().some(x=>x.l===l&&x.t===t))return false;
  if(S.custom.length>=300)return false;
  const a=[t];if(alt&&['ja','zh','el'].includes(l)&&String(alt).trim())a.push(String(alt).trim());
  S.custom.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),l,t,m,q:`Escríbelo en ${LP[l]}: «${m}»`,a,c:null,note:String(note||'').slice(0,240),pre:[],custom:true});
  reindex();ev('CARD_ADDED',{l});save();return true;
}
const hasCard=(l,t)=>ALL().some(x=>x.l===l&&x.t===String(t||'').trim());

// ================= IA (capacidad sample) =================
async function ai(input,{json=true,tier='default',signal,onText,cache}={}){
  if(!SAMPLE)throw{code:'not_granted'};
  const o={modelTier:tier};if(cache===false)o.cache=false;if(signal)o.signal=signal;if(onText)o.onText=onText;
  return json?SAMPLE.json(input,o):SAMPLE(input,o);
}
function errCopy(e){
  const c=e&&e.code;
  if(c==='cancelled')return'';
  if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed')return'La IA no está disponible. Permite que esta página use Claude cuando se te pida.';
  if(c==='rate_limited')return'Has llegado al límite de peticiones o de uso. Espera un poco y vuelve a intentarlo.';
  if(c==='invalid_json')return'La respuesta llegó incompleta. Púlsalo de nuevo para reintentarlo.';
  if(c==='refused')return'Claude no ha podido responder con ese contenido. Cámbialo e inténtalo otra vez.';
  if(c==='session_expired')return'Tu sesión ha caducado. Vuelve a iniciar sesión en Claude.';
  return'No se pudo completar la petición. Inténtalo de nuevo.';
}
async function job(key,start,fn){
  const V=M[key]={busy:true,err:'',ctl:new AbortController(),...start};
  render();
  try{await fn(V)}catch(e){V.err=errCopy(e)}
  V.busy=false;V.ctl=null;
  if(M[key]===V&&S.tab==='tut')render();
}
(async()=>{try{SAMPLE=(window.claude&&window.claude.use)?await window.claude.use('sample'):null}catch(e){SAMPLE=null}SREADY=true;if(S&&S.tab==='tut')render()})();

// ================= FSRS: sesión de repaso =================
const avail=i=>i.pre.every(p=>S.m[p]&&S.m[p].s>=3);
const deps=id=>ALL().filter(x=>x.pre.includes(id)).length;
const inF=i=>S.f==='all'||i.l===S.f;
function prio(i,now){const m=S.m[i.id];const r=Rt((now-m.last)/DAY,m.s);return(1-r)*PW[phase(m.n)]*(1+deps(i.id)*.4)*(1+Math.min(3,(now-m.due)/DAY))}
function rr(list){const g={};list.forEach(i=>(g[i.l]=g[i.l]||[]).push(i));const o=[];let k=0;while(o.length<list.length){for(const l in g)if(g[l][k])o.push(g[l][k]);k++}return o}
function build(quick){
  const now=Date.now(),max=quick?4:12;
  let q=ALL().filter(i=>S.m[i.id]&&S.m[i.id].due<=now&&inF(i)).sort((a,b)=>prio(b,now)-prio(a,now)).slice(0,max);
  const cap=quick?(q.length?0:2):Math.min(max-q.length,q.length?3:5);
  q=q.concat(rr(ALL().filter(i=>!S.m[i.id]&&avail(i)&&inF(i))).slice(0,cap));
  return rr(q).map(i=>({id:i.id,retry:false}));
}
function lvl(i,m){if(!m)return 1;const n=m.n;if(n<3)return 2;if(n<=19)return i.c?3:2;return i.c&&n%2?3:2}
const nz=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[.,!?¿¡'’\-·\s]+/g,'');
const same=(v,arr)=>arr.some(a=>nz(a)===nz(v));
function speak(t,l){try{const u=new SpeechSynthesisUtterance(t);u.lang=VOICE[l];u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function grade(correct,level,ms){return !correct?1:SES.hint?2:(level>=2&&ms<6000?4:3)}
function answer(v){
  const c=SES.q[SES.i],it=get(c.id),m=S.m[c.id],L=lvl(it,m),ms=Date.now()-SES.t0;
  const ans=L===1?[it.m]:L===3?it.c[1]:it.a;
  const correct=L===1?v===it.m:same(v,ans);
  const g=grade(correct,L,ms);
  if(!c.retry){S.m[c.id]=schedule(m?{...m}:null,g,Date.now());ev('REVIEW',{item:c.id,lvl:L,g,ms,hint:SES.hint});SES.tot++;if(correct)SES.ok++}
  if(!correct&&!c.retry)SES.q.push({id:c.id,retry:true});
  SES.res={correct,ans:ans[0],note:it.note};save();render();
}
function finishS(){
  let msg='';
  if(SES.tot>=(SES.quick?3:6))msg=touchStreak();
  SES.done=true;SES.msg=msg;track('review_session_done',{n:SES.tot,quick:SES.quick?1:0});save();render();
}

function leaveMode(){clearTimeout(HT);Object.values(M).forEach(v=>v&&v.ctl&&v.ctl.abort());if(CH&&CH.ctl)CH.ctl.abort();CH=null;M={};KEEP={};S.mode=null}
const ACT={
  tab(d){S.tab=d.v;if(STANDALONE&&d.v==='tut')track('tutor_tab_view');render()},

  exitS(){SES=null;render()},
  hintS(){SES.hint=true;const c=SES.q[SES.i],it=get(c.id),L=lvl(it,S.m[c.id]);const a=(L===3?it.c[1]:it.a)[0];const el=document.getElementById('hint');if(el)el.textContent='Empieza por «'+a.slice(0,1)+'» · '+a.length+' caracteres'},

  say(d){const[k,i]=d.v.split(':');let t,l;if(k==='chat'){t=CH.view[+i].text;l=CH.l}else if(k==='sit'){t=M.sit.res[+i].phrase;l=M.sit.l}else if(k==='voc'){t=M.voc.items[+i].w;l=M.voc.l}else if(k==='esc'){t=M.esc.data.text;l=M.esc.l}if(t)speak(t,l)},
  sv(d){const[k,i]=d.v.split(':');let ok=false;
    if(k==='sit'){const x=M.sit.res[+i];ok=saveCard({l:M.sit.l,t:x.phrase,m:x.meaning_es,note:x.when_es,alt:x.phonetic})}
    else if(k==='voc'){const x=M.voc.items[+i];ok=saveCard({l:M.voc.l,t:x.w,m:x.def_es,note:[x.ex,x.ex_es].filter(Boolean).join(' · '),alt:x.reading})}
    else if(k==='nw'){const x=CH.newWords[+i];ok=saveCard({l:CH.l,t:x.w,m:x.es,note:'Palabra nueva del tutor'})}
    render()},
  svAll(d){let n=0;if(d.v==='voc')M.voc.items.forEach(x=>{if(saveCard({l:M.voc.l,t:x.w,m:x.def_es,note:[x.ex,x.ex_es].filter(Boolean).join(' · '),alt:x.reading}))n++});
    if(d.v==='sit')M.sit.res.forEach(x=>{if(saveCard({l:M.sit.l,t:x.phrase,m:x.meaning_es,note:x.when_es,alt:x.phonetic}))n++});
    if(d.v==='nw')CH.newWords.forEach(x=>{if(saveCard({l:CH.l,t:x.w,m:x.es,note:'Palabra nueva del tutor'}))n++});
    render()},
  go(d){({sit:runSit,cor:runCor,ana:runAna,voc:runVoc,esc:runEsc,dia:runDia})[d.v]()},
  evalEsc(){runEscEval()},
  togTxt(){M.esc.show=!M.esc.show;render()},
  chatStart(d){chatStart(d.v)},
  send(){const t=readVal('chat-in');if(!t||!CH||CH.busy)return;KEEP['chat-in']='';chatTurn(t)},
  retryChat(){chatTurn(null)},
  finish(){chatFinish()},
  newChat(){clearTimeout(HT);CH=null;KEEP={};render()},
  drill(d){leaveMode();S.cfg.lang=d.v;S.cfg.topics.tutor='mis errores recurrentes';S.tab='tut';S.mode='tutor';save();render()},
  chal(){const j=S.journal[S.journal.length-1];if(!j)return;leaveMode();S.cfg.lang=j.l;S.cfg.topics.tutor=String(j.challenge||'').slice(0,140);S.tab='tut';S.mode='tutor';save();render()},
  goTutor(){S.tab='tut';render()},

// ================= Chat: tutor y roleplay =================
const RDF=l=>l==='ja'?'rōmaji de tu frase':l==='zh'?'pinyin con marcas de tono de tu frase':l==='el'?'transliteración latina de tu frase':'';
function rulesTutor(C){
  return `Eres mi tutor de ${LP[C.l]}. Mi nivel es ${C.level}. Quiero practicar conversaciones sobre: ${C.topic}.
Reglas:
- Háblame solo en ${LP[C.l]}, con 1 a 3 frases cortas y termina con una pregunta. Adapta el vocabulario a mi nivel. Palabras que ya conozco: ${frontier(C.l)}. Introduce como mucho 1 o 2 palabras nuevas por turno.
- Si me atasco, la app muestra tu campo "hint_es": una pista breve en español sobre cómo responder, sin darme la respuesta completa.
- Corrige mis errores al final de cada intercambio, en "corrections", sin interrumpir la conversación en "reply". Si no hay errores, usa una lista vacía.
- Mis errores recurrentes: ${errCtx(C.l)}. Provoca de forma natural que use esas estructuras.
- Todas las explicaciones, en español.
Responde SOLO con un objeto JSON con esta forma:
{"reply":"tu mensaje en ${LP[C.l]}","reading":"${RDF(C.l)}","hint_es":"pista en español","corrections":[{"wrong":"fragmento mío","right":"forma correcta","why_es":"explicación en una frase","cat":"gramática|vocabulario|ortografía|orden","pattern":"nombre corto de la regla"}],"new_words":[{"w":"palabra nueva","es":"traducción"}]}`;
}
function rulesRole(C){
  return `Simula esta situación: ${C.topic}. Tú interpretas a la otra persona y respondes como un nativo de ${LP[C.l]}; yo soy yo mismo. Mi nivel es ${C.level}: usa frases cortas y naturales, sin salirte de la situación. Palabras que ya conozco: ${frontier(C.l)}.
Después de cada intercambio dame feedback en español: qué hice bien, qué mejorar y qué frase alternativa en ${LP[C.l]} hubiera sido más natural. Mis errores recurrentes: ${errCtx(C.l)}.
Si me atasco, la app muestra tu "hint_es": una pista breve en español.
Responde SOLO con un objeto JSON con esta forma:
{"reply":"lo que dice tu personaje en ${LP[C.l]}","reading":"${RDF(C.l)}","hint_es":"pista en español","feedback":{"bien":"qué hice bien","mejorar":"qué mejorar","alternativa":"frase más natural en ${LP[C.l]}"},"errors":[{"cat":"gramática|vocabulario|ortografía|orden|registro","pattern":"nombre corto de la regla","wrong":"fragmento mío"}]}`;
}
function chatStart(mode){
  const topic=readTopic(mode);
  CH={mode,l:S.cfg.lang,level:S.cfg.level,topic,turns:[],view:[],busy:false,err:'',hintShown:false,log:[],alts:[],newWords:[],ctl:null,userMsgs:0,done:false};
  CH.rules=mode==='tutor'?rulesTutor(CH):rulesRole(CH);
  CH.first=mode==='tutor'?'Empieza tú: saluda y hazme la primera pregunta sobre el tema. "corrections" debe ser una lista vacía.':'Empieza tú: presenta la situación con tu primera frase como esa persona. "feedback" debe ser null y "errors" una lista vacía.';
  KEEP['chat-in']='';
  chatTurn(null);
}
const trimT=t=>{if(t.length<=21)return t;const tail=t.slice(-20);while(tail.length&&tail[0].role!=='user')tail.shift();return[t[0],...tail]};
async function chatTurn(text){
  const C=CH;if(!C||C.busy)return;
  clearTimeout(HT);C.hintShown=false;C.err='';
  if(text==null)C.turns=[{role:'user',content:C.rules+'\n\n'+C.first}];
  else{C.view.push({who:'me',text});C.turns.push({role:'user',content:'Alumno: '+text});C.userMsgs++}
  C.busy=true;C.ctl=new AbortController();C.scroll=true;render();
  try{
    const r=await ai(trimT(C.turns),{tier:'quick',cache:false,signal:C.ctl.signal});
    if(!r||typeof r.reply!=='string'||!r.reply.trim())throw{code:'invalid_json'};
    C.turns.push({role:'assistant',content:JSON.stringify(r)});
    if(text!=null){
      const me=C.view[C.view.length-1];
      if(C.mode==='tutor'){
        const cs=(Array.isArray(r.corrections)?r.corrections:[]).filter(c=>c&&c.wrong&&c.right);
        me.corr=cs;cs.forEach(c=>{C.log.push(c);addErr(C.l,c.cat,c.pattern||c.why_es,c.wrong+' → '+c.right)});
      }else{
        const f=r.feedback&&typeof r.feedback==='object'?r.feedback:null;
        me.fb=f;if(f&&f.alternativa)C.alts.push({mejorar:f.mejorar,alt:f.alternativa});
        (Array.isArray(r.errors)?r.errors:[]).forEach(c=>{if(c)addErr(C.l,c.cat,c.pattern,c.wrong)});
      }
    }
    (Array.isArray(r.new_words)?r.new_words:[]).forEach(w=>{if(w&&w.w&&w.es&&!C.newWords.some(x=>x.w===w.w))C.newWords.push({w:String(w.w),es:String(w.es)})});
    C.view.push({who:'bot',text:r.reply,reading:r.reading||'',hint:r.hint_es||''});
  }catch(e){
    C.err=errCopy(e);
    if(text!=null){C.view.pop();C.turns.pop();C.userMsgs--;KEEP['chat-in']=text}
  }
  C.busy=false;C.ctl=null;C.scroll=true;
  if(CH===C&&S.tab==='tut'&&S.mode===C.mode){render();armHint()}
}
function armHint(){
  clearTimeout(HT);const C=CH;if(!C||C.busy||C.hintShown||C.done)return;
  const last=C.view[C.view.length-1];if(!last||last.who!=='bot'||!last.hint)return;
  HT=setTimeout(()=>{if(CH===C&&!C.busy&&!C.hintShown){C.hintShown=true;const s=document.getElementById('hint-slot');if(s)s.innerHTML=hintHtml(C)}},10000);
}
const hintHtml=C=>{const l=C.view[C.view.length-1];return l&&l.who==='bot'&&l.hint?`<div class="hint"><b>Pista:</b> ${esc(l.hint)}</div>`:''};
function chatFinish(){
  const C=CH;if(!C)return;clearTimeout(HT);if(C.ctl)C.ctl.abort();
  if(C.userMsgs===0){CH=null;render();return}
  C.done=true;C.msg=C.userMsgs>=4?touchStreak():'';
  ev('CHAT',{mode:C.mode,l:C.l,n:C.userMsgs,errs:C.log.length});save();render();
}

function card(){
  const c=SES.q[SES.i],it=get(c.id),m=S.m[c.id],L=lvl(it,m),r=SES.res,pct=Math.round(100*SES.i/SES.q.length);
  const prompt=L===3?esc(it.c[0]):esc(it.q);
  let body='';
  const sayB=`<button data-a="sayI" data-v="${it.id}"><span class="row" style="justify-content:center;gap:8px">${ic('sound',18)}Escuchar</span></button>`;
  if(r){body=`<div class="fb ${r.correct?'':'x'}" role="status">${ic(r.correct?'check':'x',22)}<div><b>${r.correct?'Correcto':'Respuesta: '+esc(r.ans)}</b><span class="mut">${esc(r.note)}</span></div></div><div class="tools">${sayB}<button class="pri" style="width:auto;flex:2;padding:12px" data-a="nextS">Siguiente</button></div>`}
  else if(L===1){const o=ALL().filter(x=>x.l===it.l&&x.id!==it.id).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.m).concat(it.m).sort(()=>Math.random()-.5);
    body=`<div class="opts">${o.map(x=>`<button data-a="mc" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="tools">${sayB}</div>`}
  else body=`<input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Tu respuesta" placeholder="Escribe tu respuesta"><p class="mut" id="hint" style="margin-top:8px;min-height:20px"></p><div class="tools"><button data-a="hintS">Pista</button>${sayB}<button class="pri" style="width:auto;flex:2;padding:12px" data-a="chk">Comprobar</button></div>`;
  setTimeout(()=>{const a=document.getElementById('ans');if(a)a.focus()},0);
  const g=esc(it.t),ph=phase(m?m.n:0);
  return`<div class="row sp"><button class="icb" data-a="exitS" aria-label="Salir de la sesión">${ic('back')}</button><span class="pill">${ph==='ACQ'?'Adquisición':ph==='CONS'?'Consolidación':'Mantenimiento'}</span><span class="mut num">${Math.min(SES.i+1,SES.q.length)} / ${SES.q.length}</span></div>

}

function chatView(){

      }else if(C.mode==='rol'&&v.fb){
        n=`<details class="note" ${i===meIdx?'open':''}><summary>Feedback</summary><div><b>Bien:</b> ${esc(v.fb.bien||'')}</div><div><b>Mejorar:</b> ${esc(v.fb.mejorar||'')}</div><div><b>Más natural:</b> ${esc(v.fb.alternativa||'')}</div></details>`;

  let out=setup('esc',{label:'Tema del audio',ph:'una receta, un viaje…',presets:['una receta sencilla','un viaje en tren','mi barrio','una entrevista']})+goBtn('esc',V&&V.data?'Generar otro párrafo':'Generar ejercicio',V)+wait('esc',V)+errBox(V);
  if(V&&V.data){const d=V.data;
    out+=`<div class="box" style="margin-top:12px"><div class="row wrap"><button data-a="say" data-v="esc:0">Escuchar el párrafo</button><button data-a="togTxt">${V.show?'Ocultar texto':'Mostrar texto'}</button></div><p class="mut" style="margin-top:8px">Escucha primero sin leer. Si no oyes nada, tu dispositivo puede no tener voz para este idioma: muestra el texto.</p>${V.show?`<p style="margin-top:10px">${esc(d.text)}</p>${d.reading?`<p class="rd">${esc(d.reading)}</p>`:''}<p class="mut" style="margin-top:6px">${esc(d.text_es||'')}</p>`:''}</div>
    <h2>Preguntas</h2>${d.questions.map((q,i)=>{const r=V.res&&V.res.results[i];return `<div class="box" style="margin-bottom:10px"><label class="lab" style="margin-top:0" for="ea-${i}">${i+1}. ${esc(q)}</label><input type="text" id="ea-${i}" data-keep autocomplete="off" spellcheck="false">${r?`<p style="margin-top:8px"><span class="${r.ok==='si'?'ok':r.ok==='parcial'?'':'bad'}">${r.ok==='si'?'Correcta':r.ok==='parcial'?'Parcial':'Incorrecta'}</span> <span class="mut">· ${esc(r.understanding||'')}</span></p><p class="mut">${esc(r.feedback_es||'')}</p><p class="mut"><b>Modelo:</b> ${esc(r.model_answer||'')}</p>`:''}</div>`}).join('')}
    ${V.eb?`<div class="box row sp"><span>Evaluando tus respuestas…</span><button class="mini" data-a="stop" data-v="esc">Parar</button></div>`:`<button class="pri" data-a="evalEsc">Evaluar mis respuestas</button>`}${V.res&&V.res.verdict_es?`<div class="box" style="margin-top:12px"><h3>Valoración</h3><p>${esc(V.res.verdict_es)}</p></div>`:''}`;
  }
  return out;
}
function vDia(){
  const V=M.dia,l=S.cfg.lang;
  let out=setup('dia',{txtLabel:'¿Qué hiciste hoy?'})+goBtn('dia','Analizar mi día',V)+wait('dia',V)+errBox(V);
  if(V&&V.res){const r=V.res;
    out+=`<div class="box" style="margin-top:12px"><h3>Reto para mañana</h3><p>${esc(r.challenge||'')}</p>${r.progress_es?`<p class="mut" style="margin-top:6px">${esc(r.progress_es)}</p>`:''}${r.msg?`<p class="ok" style="margin-top:6px">${esc(r.msg.trim())}</p>`:''}</div>`;
    if(r.patterns_es.length)out+=`<h2>Patrones en tus errores</h2><div class="box"><ul style="margin:0;padding-left:18px">${r.patterns_es.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`;
    if(r.errors.length)out+=`<h2>Correcciones</h2><div class="box">${issueRows(r.errors)}</div>`;
    if(r.repeated.length)out+=`<h2>Vocabulario que repites</h2><div class="box">${r.repeated.map(x=>`<div class="cardi"><b>${esc(x.word)}</b> <span class="mut">×${esc(x.count||'')}</span><div>${(Array.isArray(x.alternatives)?x.alternatives:[]).map(a=>`<span class="tag">${esc(a)}</span>`).join('')}</div></div>`).join('')}</div>`;
    if(r.new_expressions.length)out+=`<h2>Expresiones nuevas</h2><div class="box">${r.new_expressions.map(x=>`<div class="cardi"><div class="big">${esc(x.expr)}</div><p>${esc(x.es||'')}</p><p class="mut">${esc(x.example||'')}</p></div>`).join('')}</div>`;
  }
  const h=S.journal.filter(e=>e.l===l).slice(-7);
  if(h.length)out+=`<h2>Errores por entrada (${LN[l]})</h2><div class="box"><div class="cols" role="img" aria-label="Errores por entrada del diario">${h.map(e=>`<div class="col"><span>${e.nErr}</span><i style="height:${Math.min(56,e.nErr*8)}px"></i><span>${esc(e.d.slice(5))}</span></div>`).join('')}</div></div>`;
  return out;
}

// ---- Errores ----
function errs(){
  const all=errList();
  if(!all.length)return`<div class="empty">${av(88)}<h2>Aún no hay errores</h2><p class="mut">Aparecerán aquí cuando uses el tutor, el corrector o el diario. El tutor los usará para provocarlos en la conversación.</p><button class="pri" data-a="goTutor">Ir al Tutor IA</button></div>`;
  return`<h2 style="margin-top:4px">Memoria de errores</h2>`+LANGS.map(l=>{const e=errList(l).slice(0,8);if(!e.length)return'';
    return`<div class="box ${l}" style="margin-bottom:12px"><div class="row" style="margin-bottom:8px"><div class="lg" style="width:36px;height:36px;font-size:17px;border-radius:11px" aria-hidden="true">${GL[l]}</div><h3 style="margin:0">${LN[l]}</h3></div>${e.map(x=>`<div class="cardi"><div class="row sp"><b>${esc(x.pattern)}</b><span class="tag num">${x.n}×</span></div><div class="mut">${esc(x.cat)} · última vez ${esc(x.last||'')}</div>${x.ex?`<div style="font-size:15px">${esc(x.ex)}</div>`:''}</div>`).join('')}<div class="tools"><button data-a="drill" data-v="${l}">Reforzar con el tutor</button></div></div>`}).join('');
}

load();render();
</script>

</body></html>
